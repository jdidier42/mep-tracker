<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi MEP — OneOrtho Medical</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F8F7F4;min-height:100vh;padding:2rem 1.5rem;color:#1a1a1a}
.app{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:16px;border-bottom:1px solid #E8E5DE}
.logo{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:#004B32;letter-spacing:-0.3px}
.logo em{font-style:normal;color:#AAE66E}
.logo-sub{font-size:11px;color:#aaa;font-weight:400;margin-top:1px;letter-spacing:0.2px}
.header-actions{display:flex;gap:8px;align-items:center}

/* Buttons */
.btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#333;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s;line-height:1;white-space:nowrap}
.btn:hover{background:#F2EFE8;border-color:#ccc}
.btn-primary{background:#004B32;color:#fff;border-color:#004B32}
.btn-primary:hover{background:#003825}
.btn-muted{background:transparent;color:#888;border-color:#E0DDD6}
.btn-muted:hover{background:#F2EFE8;color:#444}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px 8px;min-width:32px;justify-content:center;border-radius:7px}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#333;cursor:pointer;appearance:auto;max-width:160px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-month{font-family:'Sora',sans-serif;font-weight:600;font-size:15px;color:#1a1a1a;min-width:152px;text-align:center}
.views{display:flex;gap:0;margin-left:auto;border:1px solid #E0DDD6;border-radius:8px;overflow:hidden;background:#fff}
.view-btn{padding:7px 11px;border:none;background:transparent;font-size:13px;cursor:pointer;color:#aaa;transition:all .12s}
.view-btn:first-child{border-right:1px solid #E0DDD6}
.view-btn.active{background:#004B32;color:#fff}

/* Legend */
.legend-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.legend-chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;cursor:pointer;padding:5px 11px;border-radius:99px;border:1px solid #E0DDD6;background:#fff;color:#555;transition:all .12s}
.legend-chip:hover{border-color:#aaa}
.legend-chip.active{border-color:currentColor;background:#fff;font-weight:600}
.legend-chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-clear{font-size:12px;color:#aaa;cursor:pointer;padding:5px 10px;border-radius:99px;border:1px solid #E0DDD6;background:#fff;transition:all .12s}
.legend-clear:hover{color:#333;border-color:#aaa}
.legend-count{margin-left:auto;font-size:12px;color:#bbb;font-weight:500}

/* Calendar */
.calendar{background:#fff;border-radius:12px;border:1px solid #E8E5DE;overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #E8E5DE}
.cal-day-label{text-align:center;padding:10px 4px;font-size:10px;font-weight:600;color:#bbb;text-transform:uppercase;letter-spacing:.8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:90px;border-right:1px solid #F0EDE6;border-bottom:1px solid #F0EDE6;padding:8px 6px;cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:#FAFAF7}
.cal-cell.empty{background:#FAFAF7;cursor:default}
.day-num{font-size:11px;color:#ccc;margin-bottom:5px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:600}
.day-num.today{background:#004B32;color:#fff}
.event-pill{font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .1s;-webkit-tap-highlight-color:transparent}
.event-pill:hover{opacity:.7}
.more-link{font-size:10px;color:#ccc;cursor:pointer;padding:1px 3px;margin-top:1px}

/* List */
.list-view{display:flex;flex-direction:column;gap:4px}
.list-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid #E8E5DE;border-radius:9px;cursor:pointer;background:#fff;transition:all .1s}
.list-item:hover{background:#FAFAF7;border-color:#D5D2CB}
.list-date{font-size:11px;color:#bbb;min-width:46px;flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums}
.list-bar{width:3px;height:28px;border-radius:99px;flex-shrink:0}
.list-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-tags{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;flex-shrink:0}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;padding:2rem;width:440px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 4px 40px rgba(0,0,0,0.12)}
.modal-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:1.5rem}
.f-label{font-size:11px;color:#aaa;display:block;margin-bottom:5px;margin-top:14px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.f-input{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#1a1a1a;transition:border-color .12s}
.f-input:focus{outline:none;border-color:#004B32;box-shadow:0 0 0 3px rgba(0,75,50,0.07)}
.f-textarea{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#1a1a1a;resize:vertical;min-height:64px;transition:border-color .12s}
.f-textarea:focus{outline:none;border-color:#004B32;box-shadow:0 0 0 3px rgba(0,75,50,0.07)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #F0EDE6}
.detail-row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #F5F3EE;font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#bbb;min-width:90px;font-size:11px;flex-shrink:0;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding-top:2px}

/* Multi-product picker */
.prod-picker{display:flex;flex-direction:column;gap:2px;padding:6px;background:#fff;border-radius:8px;border:1px solid #E0DDD6;max-height:160px;overflow-y:auto}
.prod-check{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .1s;user-select:none}
.prod-check:hover{background:#F8F7F4}
.prod-check input[type=checkbox]{width:15px;height:15px;accent-color:#004B32;cursor:pointer;flex-shrink:0}
.prod-check-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.prod-check-name{font-size:13px;color:#333}
.prod-tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

/* Settings */
.settings-panel{background:#fff;border-radius:12px;border:1px solid #E8E5DE;overflow:hidden}
.stabs{display:flex;border-bottom:1px solid #E8E5DE}
.stab{padding:13px 20px;font-size:13px;font-weight:500;cursor:pointer;color:#aaa;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;transition:all .12s;white-space:nowrap}
.stab:hover:not(.active){color:#555}
.stab.active{color:#004B32;border-bottom-color:#004B32;font-weight:600}
.sbody{padding:1.75rem}
.section-title{font-size:11px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.entity-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.entity-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid #EAE7E0;border-radius:9px;background:#fff;transition:all .1s}
.entity-row:hover{border-color:#D0CEC8;background:#FAFAF7}
.e-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.e-name{flex:1;font-size:13px;font-weight:500;color:#1a1a1a}
.e-count{font-size:11px;color:#ccc;font-weight:500}
.e-actions{display:flex;gap:5px;flex-shrink:0}
.act-edit{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;border:1px solid #E0DDD6;background:#fff;cursor:pointer;color:#aaa;font-size:14px;transition:all .12s}
.act-edit:hover{background:#F0FAF5;border-color:#004B32;color:#004B32}
.act-del{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;border:1px solid #F5DADA;background:#FFF8F8;cursor:pointer;color:#E24B4A;font-size:14px;transition:all .12s}
.act-del:hover{background:#E24B4A;border-color:#E24B4A;color:#fff}
.add-zone{background:#FAFAF7;border-radius:9px;padding:14px;border:1px dashed #DDD9D2;margin-top:6px}
.add-zone-label{font-size:10px;font-weight:700;color:#ccc;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
.add-row{display:flex;gap:8px;align-items:center}
.cpick{width:38px;height:36px;border:1px solid #E0DDD6;border-radius:7px;cursor:pointer;padding:3px;background:#fff;flex-shrink:0}
.add-input{flex:1;font-family:'Inter',sans-serif;font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#1a1a1a;transition:border-color .12s}
.add-input:focus{outline:none;border-color:#004B32;box-shadow:0 0 0 3px rgba(0,75,50,0.07)}
.inline-edit-row{display:flex;gap:8px;align-items:center;flex:1}
.inline-edit-input{flex:1;font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #AAE66E;background:#F5FDF0;color:#1a1a1a;outline:none}
.settings-footer{padding:12px 20px;border-top:1px solid #F0EDE6;display:flex;align-items:center;justify-content:space-between;background:#FAFAF7}

/* Empty */
.empty-state{text-align:center;padding:4rem 2rem;color:#ccc;font-size:13px;background:#fff;border-radius:12px;border:1px solid #E8E5DE;line-height:1.8}
.empty-state i{font-size:36px;display:block;margin-bottom:14px;color:#ddd}
.empty-strong{font-weight:600;color:#888;background:#F0EDE8;padding:1px 7px;border-radius:5px}
.no-entries{font-size:13px;color:#ccc;padding:8px 0;font-style:italic}

/* Loading */
.loading-screen{text-align:center;padding:5rem 2rem;color:#ccc;font-size:13px}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#AAE66E;animation:pulse 1.2s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}
.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media(max-width:640px){
  body{padding:1rem .75rem}
  .app{gap:10px}

  /* Header */
  .header{padding-bottom:12px;gap:10px}
  .logo{font-size:16px}
  .header-actions .btn-muted{display:none} /* masquer Export CSV sur mobile */
  .btn{font-size:12px;padding:7px 11px;gap:5px}
  .btn-primary{padding:7px 12px}

  /* Toolbar */
  .toolbar{gap:6px}
  .cal-month{font-size:13px;min-width:120px}
  .toolbar select{font-size:12px;padding:6px 8px}

  /* Calendar — cellules plus petites */
  .cal-cell{min-height:56px;padding:4px 3px}
  .cal-day-label{font-size:9px;padding:7px 2px;letter-spacing:.4px}
  .day-num{font-size:10px;width:18px;height:18px;margin-bottom:2px}
  .event-pill{font-size:9px;padding:2px 4px;border-radius:4px}
  .more-link{font-size:9px}

  /* Legend — scroll horizontal */
  .legend-bar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .legend-bar::-webkit-scrollbar{display:none}
  .legend-chip{white-space:nowrap;flex-shrink:0;font-size:11px;padding:4px 9px}
  .legend-count{display:none}

  /* List */
  .list-item{padding:10px 12px;gap:10px;flex-wrap:wrap}
  .list-date{min-width:38px;font-size:10px}
  .list-name{font-size:12px;min-width:0;width:100%;flex:none;order:3;white-space:normal}
  .list-bar{height:20px}
  .list-tags{order:4;width:100%}

  /* Modal — plein écran en bas */
  .modal-overlay{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;width:100%;max-width:100%;padding:1.5rem 1.25rem;max-height:92vh}
  .modal-title{font-size:15px}

  /* Settings */
  .stab{padding:11px 14px;font-size:12px;gap:5px}
  .sbody{padding:1.25rem}
  .entity-row{padding:9px 12px;gap:8px}
  .e-name{font-size:12px}
  .add-zone{padding:12px}
  .add-row{flex-wrap:wrap}
  .add-input{min-width:0;width:calc(100% - 46px)}

  /* Header actions mobile — bouton configurer icône seule */
  .btn-label-mobile{display:none}
}

@media(max-width:380px){
  .cal-cell{min-height:46px;padding:3px 2px}
  .event-pill{display:none} /* trop petit, afficher seulement le point */
  .day-num{font-size:9px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const SB_URL='https://odsvvwmtlkglpjqeqjjq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kc3Z2d210bGtnbHBqcWVxampxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTc2NjEsImV4cCI6MjA5NDkzMzY2MX0.aA2LxUE9N8ZYF_p4W2SEOyMS-OVIIlGPSRFGXZKKKMU';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};

async function sbGet(table){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?select=*`,{headers:H});
  return r.ok?r.json():[];
}
async function sbUpsert(table,row){
  const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(row)});
  return r.ok;
}
async function sbDelete(table,col,val){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?${col}=eq.${encodeURIComponent(val)}`,{method:'DELETE',headers:H});
  return r.ok;
}
async function sbPatch(table,col,val,data){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?${col}=eq.${encodeURIComponent(val)}`,{method:'PATCH',headers:H,body:JSON.stringify(data)});
  return r.ok;
}

/* Mapping DB -> app */
function dbToRelease(r){return{id:r.id,name:r.name,clientId:r.client_id,productIds:r.product_ids||[],date:r.date,env:r.env,status:r.status,note:r.note||''}}
function releaseToDb(r){return{id:r.id,name:r.name,client_id:r.clientId,product_ids:r.productIds||[],date:r.date,env:r.env,status:r.status,note:r.note||''}}

const STATUSES=[
  {key:'planned',label:'Planifiée',color:'#378ADD',bg:'#e6f1fb'},
  {key:'in_progress',label:'En cours',color:'#BA7517',bg:'#faeeda'},
  {key:'done',label:'Déployée',color:'#004B32',bg:'#e1f5ee'},
  {key:'failed',label:'Échouée',color:'#A32D2D',bg:'#fcebeb'},
  {key:'rollback',label:'Rollback',color:'#702D5A',bg:'#f5e8f2'}
];
function stOf(k){return STATUSES.find(s=>s.key===k)||STATUSES[0]}

let products=[],clients=[],releases=[];

function prodById(id){return products.find(p=>p.id===id)}
function clientById(id){return clients.find(c=>c.id===id)}
function clientColor(cid){return(clientById(cid)||{color:'#aaa'}).color}

let S={
  year:new Date().getFullYear(),month:new Date().getMonth(),
  filterClient:'all',filterStatus:'all',
  view:'calendar',page:'main',stab:'clients',
  modal:null,editId:null,detailId:null,loading:false,
  form:{name:'',productIds:[],clientId:'',date:'',env:'Production',status:'planned',note:''},
  editingProdId:null,editingProdName:'',editingProdColor:'',
  editingClientId:null,editingClientName:'',editingClientColor:'',
  newProdName:'',newProdColor:'#9F8AEA',
  newClientName:'',newClientColor:'#AAE66E',
};

async function loadAll(){
  S.loading=true;render();
  try{
    const [c,p,r]=await Promise.all([sbGet('clients'),sbGet('products'),sbGet('releases')]);
    clients=c||[];
    products=p||[];
    releases=(r||[]).map(dbToRelease);
  }catch(e){console.error(e)}
  S.loading=false;render();
}

function filtered(){
  return releases.filter(r=>{
    if(S.filterClient!=='all'&&r.clientId!==S.filterClient)return false;
    if(S.filterStatus!=='all'&&r.status!==S.filterStatus)return false;
    return true;
  });
}

function toggleProd(pid){
  const ids=S.form.productIds;
  S.form.productIds=ids.includes(pid)?ids.filter(x=>x!==pid):[...ids,pid];
  render();
}

function prodTagsHtml(productIds){
  if(!productIds||!productIds.length)return`<span style="color:#bbb;font-size:12px;font-style:italic">Aucun</span>`;
  return productIds.map(pid=>{
    const p=prodById(pid);if(!p)return'';
    return`<span class="tag" style="background:#ede9e0;color:#444">${p.name}</span>`;
  }).join('');
}

function renderCalendar(){
  const dim=new Date(S.year,S.month+1,0).getDate();
  const sd=new Date(S.year,S.month,1).getDay()||7;
  const today=new Date();
  const byDay={};
  filtered().forEach(r=>{
    const rd=new Date(r.date+'T00:00:00');
    if(rd.getFullYear()===S.year&&rd.getMonth()===S.month){
      const k=rd.getDate();if(!byDay[k])byDay[k]=[];byDay[k].push(r);
    }
  });
  const labels=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  let cells='';
  for(let i=1;i<sd;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=dim;d++){
    const isT=today.getDate()===d&&today.getMonth()===S.month&&today.getFullYear()===S.year;
    const dr=byDay[d]||[];const show=dr.slice(0,2);const more=dr.length-2;
    cells+=`<div class="cal-cell" onclick="clickDay(${d})">
      <div class="day-num${isT?' today':''}">${d}</div>
      ${show.map(r=>{
        const c=clientColor(r.clientId);
        const pids=r.productIds||[];
        const label=r.name+(pids.length>1?` (${pids.length})`:'');
        return`<div class="event-pill" style="background:${c}28;color:${c};border:1px solid ${c}66" onclick="event.stopPropagation();openDetail(${r.id})" title="${pids.map(id=>{const p=prodById(id);return p?p.name:''}).join(', ')}">${label}</div>`;
      }).join('')}
      ${more>0?`<div class="more-link">+${more} autres</div>`:''}
    </div>`;
  }
  return`<div class="calendar">
    <div class="cal-head">${labels.map(l=>`<div class="cal-day-label">${l}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}

function renderList(){
  const filt=filtered().sort((a,b)=>a.date.localeCompare(b.date));
  if(!filt.length)return`<div class="empty-state"><i class="ti ti-list-search"></i>Aucune mise en production pour cette sélection</div>`;
  return`<div class="list-view">${filt.map(r=>{
    const st=stOf(r.status);const c=clientColor(r.clientId);
    const cli=clientById(r.clientId);const pids=r.productIds||[];
    return`<div class="list-item" onclick="openDetail(${r.id})">
      <div class="list-date">${r.date.slice(5).replace('-','/')}</div>
      <div class="list-bar" style="background:${c}"></div>
      <div class="list-name">${r.name}</div>
      <div class="list-tags">
        <span class="tag" style="background:${st.bg};color:${st.color}">${st.label}</span>
        ${cli?`<span class="tag" style="background:${c}22;color:${c}">${cli.name}</span>`:''}
        ${pids.map(pid=>{const p=prodById(pid);return p?`<span class="tag" style="background:#ede9e0;color:#555">${p.name}</span>`:''}).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderModal(){
  if(!S.modal)return'';
  if(S.modal==='form'){
    const f=S.form;const isEdit=!!S.editId;
    const pickerHtml=products.length?`<div class="prod-picker">${products.map(p=>{
      const checked=(f.productIds||[]).includes(p.id);
      return`<label class="prod-check">
        <input type="checkbox" ${checked?'checked':''} onchange="toggleProd('${p.id}')">
        <div class="prod-check-dot" style="background:${p.color}"></div>
        <span class="prod-check-name">${p.name}</span>
      </label>`;
    }).join('')}</div>`:`<p style="font-size:12px;color:#bbb;padding:6px 0;font-style:italic">Aucun produit — ajoutez-en dans Configurer</p>`;
    return`<div class="modal-overlay" onclick="cModal(event)"><div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">${isEdit?'Modifier la MEP':'Nouvelle mise en production'}</div>
      <span class="f-label">Nom / version</span>
      <input class="f-input" type="text" value="${f.name}" oninput="sf('name',this.value)" placeholder="Ex: Déploiement v2.5">
      <span class="f-label">Client</span>
      ${clients.length?`<select class="f-input" onchange="sf('clientId',this.value)">${clients.map(c=>`<option value="${c.id}"${f.clientId===c.id?' selected':''}>${c.name}</option>`).join('')}</select>`:`<p style="font-size:12px;color:#bbb;padding:6px 0;font-style:italic">Aucun client — ajoutez-en dans Configurer</p>`}
      <span class="f-label">Produits <span style="font-weight:400;color:#aaa">(un ou plusieurs)</span></span>
      ${pickerHtml}
      <span class="f-label">Date de mise en production</span>
      <input class="f-input" type="date" value="${f.date}" onchange="sf('date',this.value)">
      <span class="f-label">Environnement</span>
      <select class="f-input" onchange="sf('env',this.value)">${['Staging','Pre-prod','Production'].map(e=>`<option${f.env===e?' selected':''}>${e}</option>`).join('')}</select>
      <span class="f-label">Statut</span>
      <select class="f-input" onchange="sf('status',this.value)">${STATUSES.map(s=>`<option value="${s.key}"${f.status===s.key?' selected':''}>${s.label}</option>`).join('')}</select>
      <span class="f-label">Note</span>
      <textarea class="f-textarea" oninput="sf('note',this.value)" placeholder="Commentaire, lien JIRA...">${f.note||''}</textarea>
      <div class="modal-actions">
        <button class="btn" onclick="cModal()">Annuler</button>
        ${isEdit?`<button class="btn" style="color:#E24B4A;border-color:rgba(226,75,74,0.4)" onclick="delRelease(${S.editId})"><i class="ti ti-trash"></i> Supprimer</button>`:''}
        <button class="btn btn-primary" onclick="saveRelease()"><i class="ti ti-check"></i> ${isEdit?'Enregistrer':'Ajouter'}</button>
      </div>
    </div></div>`;
  }
  if(S.modal==='detail'){
    const r=releases.find(x=>x.id===S.detailId);if(!r)return'';
    const st=stOf(r.status);const c=clientColor(r.clientId);
    const cli=clientById(r.clientId);const pids=r.productIds||[];
    return`<div class="modal-overlay" onclick="cModal(event)"><div class="modal" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
        <div class="modal-title" style="margin:0">${r.name}</div>
        <button class="btn btn-sm" onclick="openEdit(${r.id})"><i class="ti ti-edit"></i> Modifier</button>
      </div>
      <div style="display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;margin-bottom:14px;background:${st.bg};color:${st.color}">
        <span style="width:8px;height:8px;border-radius:50%;background:${st.color};display:inline-block"></span>${st.label}
      </div>
      <div class="detail-row"><span class="detail-label">Client</span>${cli?`<span class="tag" style="background:${c}22;color:${c}">${cli.name}</span>`:'-'}</div>
      <div class="detail-row"><span class="detail-label">Produits</span><div class="prod-tags">${prodTagsHtml(pids)}</div></div>
      <div class="detail-row"><span class="detail-label">Date</span><span>${new Date(r.date+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</span></div>
      <div class="detail-row"><span class="detail-label">Environnement</span><span>${r.env}</span></div>
      ${r.note?`<div class="detail-row"><span class="detail-label">Note</span><span style="color:#666">${r.note}</span></div>`:''}
      <div class="modal-actions"><button class="btn" onclick="cModal()">Fermer</button></div>
    </div></div>`;
  }
  return'';
}

function renderSettings(){
  const tab=S.stab;
  const usageC=id=>releases.filter(r=>r.clientId===id).length;
  const usageP=id=>releases.filter(r=>(r.productIds||[]).includes(id)).length;
  let body='';
  if(tab==='clients'){
    const rows=clients.map(c=>{
      const n=usageC(c.id);
      if(S.editingClientId===c.id)return`<div class="entity-row">
        <input type="color" class="cpick" value="${S.editingClientColor}" oninput="S.editingClientColor=this.value">
        <div class="inline-edit-row">
          <input class="inline-edit-input" type="text" value="${S.editingClientName}" oninput="S.editingClientName=this.value" onkeydown="if(event.key==='Enter')saveClient('${c.id}')">
          <button class="btn btn-primary btn-sm" onclick="saveClient('${c.id}')"><i class="ti ti-check"></i> OK</button>
          <button class="btn btn-sm" onclick="S.editingClientId=null;render()"><i class="ti ti-x"></i></button>
        </div>
      </div>`;
      return`<div class="entity-row">
        <div class="e-dot" style="background:${c.color}"></div>
        <span class="e-name">${c.name}</span>
        <span class="e-count">${n} MEP${n>1?'s':''}</span>
        <div class="e-actions">
          <button class="act-edit" title="Renommer" onclick="startEditClient('${c.id}')"><i class="ti ti-pencil"></i></button>
          <button class="act-del" title="Supprimer" onclick="deleteClient('${c.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    }).join('');
    body=`<div class="section-title">Clients <span class="section-count">${clients.length}</span></div>
    <div class="entity-list">${rows||`<p class="no-entries">Aucun client — ajoutez-en ci-dessous</p>`}</div>
    <div class="add-zone"><div class="add-zone-label">Ajouter un client</div>
      <div class="add-row">
        <input type="color" class="cpick" value="${S.newClientColor}" oninput="S.newClientColor=this.value">
        <input class="add-input" type="text" value="${S.newClientName}" oninput="S.newClientName=this.value" placeholder="Nom du client" onkeydown="if(event.key==='Enter')addClient()">
        <button class="btn btn-primary" onclick="addClient()"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
    </div>`;
  } else if(tab==='products'){
    const rows=products.map(p=>{
      const n=usageP(p.id);
      if(S.editingProdId===p.id)return`<div class="entity-row">
        <input type="color" class="cpick" value="${S.editingProdColor}" oninput="S.editingProdColor=this.value">
        <div class="inline-edit-row">
          <input class="inline-edit-input" type="text" value="${S.editingProdName}" oninput="S.editingProdName=this.value" onkeydown="if(event.key==='Enter')saveProd('${p.id}')">
          <button class="btn btn-primary btn-sm" onclick="saveProd('${p.id}')"><i class="ti ti-check"></i> OK</button>
          <button class="btn btn-sm" onclick="S.editingProdId=null;render()"><i class="ti ti-x"></i></button>
        </div>
      </div>`;
      return`<div class="entity-row">
        <div class="e-dot" style="background:${p.color}"></div>
        <span class="e-name">${p.name}</span>
        <span class="e-count">${n} MEP${n>1?'s':''}</span>
        <div class="e-actions">
          <button class="act-edit" title="Renommer" onclick="startEditProd('${p.id}')"><i class="ti ti-pencil"></i></button>
          <button class="act-del" title="Supprimer" onclick="deleteProd('${p.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    }).join('');
    body=`<div class="section-title">Produits <span class="section-count">${products.length}</span></div>
    <div class="entity-list">${rows||`<p class="no-entries">Aucun produit — ajoutez-en ci-dessous</p>`}</div>
    <div class="add-zone"><div class="add-zone-label">Ajouter un produit</div>
      <div class="add-row">
        <input type="color" class="cpick" value="${S.newProdColor}" oninput="S.newProdColor=this.value">
        <input class="add-input" type="text" value="${S.newProdName}" oninput="S.newProdName=this.value" placeholder="Nom du produit" onkeydown="if(event.key==='Enter')addProd()">
        <button class="btn btn-primary" onclick="addProd()"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
    </div>`;
  } else {
    body=`<div class="section-title">Statuts</div>
    <div class="entity-list">${STATUSES.map(s=>`<div class="entity-row">
      <div class="e-dot" style="background:${s.color}"></div>
      <span class="e-name">${s.label}</span>
      <span class="e-count">${releases.filter(r=>r.status===s.key).length} MEP</span>
    </div>`).join('')}</div>
    <p style="font-size:12px;color:#bbb;font-style:italic">Statuts fixes — définis par le processus MDR.</p>`;
  }
  return`<div class="settings-panel">
    <div class="stabs">
      <div class="stab${tab==='clients'?' active':''}" onclick="S.stab='clients';render()"><i class="ti ti-building-hospital"></i> Clients</div>
      <div class="stab${tab==='products'?' active':''}" onclick="S.stab='products';render()"><i class="ti ti-box"></i> Produits</div>
      <div class="stab${tab==='statuses'?' active':''}" onclick="S.stab='statuses';render()"><i class="ti ti-flag"></i> Statuts</div>
    </div>
    <div class="sbody">${body}</div>
    <div class="settings-footer">
      <span style="font-size:12px;color:#bbb"><i class="ti ti-cloud" style="vertical-align:-2px;margin-right:5px"></i>Synchronisé avec Supabase</span>
      <button class="btn btn-muted btn-sm" onclick="loadAll()"><i class="ti ti-refresh"></i> Actualiser</button>
    </div>
  </div>`;
}

function exportCSV(){
  if(!releases.length){alert('Aucune MEP à exporter');return}
  const rows=[['Nom','Client','Produits','Date','Environnement','Statut','Note']];
  [...releases].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    const cli=clientById(r.clientId);const st=stOf(r.status);
    const prods=(r.productIds||[]).map(pid=>{const p=prodById(pid);return p?p.name:''}).filter(Boolean).join(' | ');
    rows.push([r.name,cli?cli.name:'',prods,r.date,r.env,st.label,r.note||'']);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='mep-oneortho.csv';a.click();
  URL.revokeObjectURL(url);
}

function render(){
  const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const filt=filtered();
  const countM=filt.filter(r=>{const d=new Date(r.date+'T00:00:00');return d.getFullYear()===S.year&&d.getMonth()===S.month}).length;

  if(S.loading){
    document.getElementById('app').innerHTML=`<div class="loading-screen"><div style="display:flex;justify-content:center;gap:6px;margin-bottom:16px"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>Chargement…</div>`;
    return;
  }

  const headerHtml=`<div class="header">
    <div>
      <div class="logo">One<em>Ortho</em></div>
      <div class="logo-sub">${S.page==='settings'?'Configuration':'Suivi des mises en production'}</div>
    </div>
    <div class="header-actions">
      ${S.page==='settings'?
        `<button class="btn btn-ghost" onclick="S.page='main';render()"><i class="ti ti-arrow-left"></i> Retour</button>`:
        `<button class="btn btn-ghost" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
         <button class="btn btn-ghost" onclick="S.page='settings';render()"><i class="ti ti-settings"></i> Configurer</button>
         <button class="btn btn-primary" onclick="openAdd()"><i class="ti ti-plus"></i> Nouvelle MEP</button>`}
    </div>
  </div>`;

  if(S.page==='settings'){document.getElementById('app').innerHTML=headerHtml+renderSettings()+renderModal();return;}

  const legendHtml=clients.length?`<div class="legend-bar">
    <span class="legend-label">Client</span>
    ${clients.map(c=>{const a=S.filterClient===c.id;return`<div class="legend-chip${a?' active':''}" style="color:${c.color}" onclick="S.filterClient=S.filterClient==='${c.id}'?'all':'${c.id}';render()">
      <div class="legend-chip-dot" style="background:${c.color}"></div>${c.name}
    </div>`;}).join('')}
    ${S.filterClient!=='all'?`<button class="legend-clear" onclick="S.filterClient='all';render()"><i class="ti ti-x"></i> Tout</button>`:''}
    <span class="legend-count">${countM} MEP ce mois</span>
  </div>`:'';

  const mainHtml=releases.length===0?
    `<div class="empty-state"><i class="ti ti-rocket"></i>Commencez par ajouter vos clients et produits dans <span class="empty-strong">Configurer</span>,<br>puis créez votre première MEP en cliquant sur <span class="empty-strong">+ Nouvelle MEP</span>.</div>`:
    (S.view==='calendar'?renderCalendar():renderList());

  document.getElementById('app').innerHTML=`${headerHtml}
    <div class="toolbar">
      <div class="cal-nav">
        <button class="btn btn-icon" onclick="prevM()"><i class="ti ti-chevron-left"></i></button>
        <span class="cal-month">${months[S.month]} ${S.year}</span>
        <button class="btn btn-icon" onclick="nextM()"><i class="ti ti-chevron-right"></i></button>
      </div>
      <select onchange="S.filterStatus=this.value;render()">
        <option value="all">Tous les statuts</option>
        ${STATUSES.map(s=>`<option value="${s.key}"${S.filterStatus===s.key?' selected':''}>${s.label}</option>`).join('')}
      </select>
      <div class="views">
        <button class="view-btn${S.view==='calendar'?' active':''}" onclick="S.view='calendar';render()"><i class="ti ti-calendar"></i></button>
        <button class="view-btn${S.view==='list'?' active':''}" onclick="S.view='list';render()"><i class="ti ti-list"></i></button>
      </div>
    </div>
    ${legendHtml}${mainHtml}${renderModal()}`;
}

function prevM(){if(S.month===0){S.month=11;S.year--}else S.month--;render()}
function nextM(){if(S.month===11){S.month=0;S.year++}else S.month++;render()}
function openAdd(){
  const today=new Date().toISOString().slice(0,10);
  S.form={name:'',productIds:[],clientId:clients[0]?.id||'',date:today,env:'Production',status:'planned',note:''};
  S.editId=null;S.modal='form';render();
}
function openEdit(id){
  const r=releases.find(x=>x.id===id);
  S.form={...r,productIds:[...(r.productIds||[])]};
  S.editId=id;S.modal='form';render();
}
function openDetail(id){S.detailId=id;S.modal='detail';render()}
function cModal(e){if(e&&e.target!==e.currentTarget)return;S.modal=null;render()}
function sf(k,v){S.form[k]=v}

async function saveRelease(){
  if(!S.form.name||!S.form.date){alert('Nom et date requis');return}
  if(!S.form.clientId&&clients.length)S.form.clientId=clients[0].id;
  const id=S.editId||Date.now();
  const row=releaseToDb({...S.form,id});
  const ok=await sbUpsert('releases',row);
  if(!ok){alert('Erreur lors de la sauvegarde');return}
  if(S.editId){const i=releases.findIndex(x=>x.id===S.editId);releases[i]={...S.form,id:S.editId}}
  else releases.push({...S.form,id});
  S.modal=null;render();
}

async function delRelease(id){
  const ok=await sbDelete('releases','id',id);
  if(!ok){alert('Erreur lors de la suppression');return}
  releases=releases.filter(x=>x.id!==id);S.modal=null;render();
}

function clickDay(d){
  const ds=`${S.year}-${String(S.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  S.form={name:'',productIds:[],clientId:clients[0]?.id||'',date:ds,env:'Production',status:'planned',note:''};
  S.editId=null;S.modal='form';render();
}

function startEditProd(id){const p=products.find(x=>x.id===id);S.editingProdId=id;S.editingProdName=p.name;S.editingProdColor=p.color;render()}
async function saveProd(id){
  const name=S.editingProdName.trim();if(!name)return;
  const ok=await sbPatch('products','id',id,{name,color:S.editingProdColor});
  if(!ok){alert('Erreur');return}
  const i=products.findIndex(p=>p.id===id);products[i]={...products[i],name,color:S.editingProdColor};
  S.editingProdId=null;render();
}
async function deleteProd(id){
  const n=releases.filter(r=>(r.productIds||[]).includes(id)).length;
  const msg=n>0?`Ce produit est lié à ${n} MEP(s). Le retirer de toutes ces MEPs ?`:'Supprimer ce produit ?';
  if(!confirm(msg))return;
  for(const r of releases.filter(r=>(r.productIds||[]).includes(id))){
    const newIds=r.productIds.filter(x=>x!==id);
    await sbPatch('releases','id',r.id,{product_ids:newIds});
    r.productIds=newIds;
  }
  const ok=await sbDelete('products','id',id);
  if(!ok){alert('Erreur');return}
  products=products.filter(p=>p.id!==id);render();
}
async function addProd(){
  const name=S.newProdName.trim();if(!name){alert('Saisissez un nom');return}
  const id='p'+Date.now();
  const ok=await sbUpsert('products',{id,name,color:S.newProdColor});
  if(!ok){alert('Erreur');return}
  products.push({id,name,color:S.newProdColor});
  S.newProdName='';render();
}
function startEditClient(id){const c=clients.find(x=>x.id===id);S.editingClientId=id;S.editingClientName=c.name;S.editingClientColor=c.color;render()}
async function saveClient(id){
  const name=S.editingClientName.trim();if(!name)return;
  const ok=await sbPatch('clients','id',id,{name,color:S.editingClientColor});
  if(!ok){alert('Erreur');return}
  const i=clients.findIndex(c=>c.id===id);clients[i]={...clients[i],name,color:S.editingClientColor};
  S.editingClientId=null;render();
}
async function deleteClient(id){
  const n=releases.filter(r=>r.clientId===id).length;
  const msg=n>0?`Ce client est lié à ${n} MEP(s). Supprimer quand même (les MEPs seront aussi supprimées) ?`:'Supprimer ce client ?';
  if(!confirm(msg))return;
  for(const r of releases.filter(r=>r.clientId===id)) await sbDelete('releases','id',r.id);
  const ok=await sbDelete('clients','id',id);
  if(!ok){alert('Erreur');return}
  releases=releases.filter(r=>r.clientId!==id);
  if(S.filterClient===id)S.filterClient='all';
  clients=clients.filter(c=>c.id!==id);render();
}
async function addClient(){
  const name=S.newClientName.trim();if(!name){alert('Saisissez un nom');return}
  const id='c'+Date.now();
  const ok=await sbUpsert('clients',{id,name,color:S.newClientColor});
  if(!ok){alert('Erreur');return}
  clients.push({id,name,color:S.newClientColor});
  S.newClientName='';render();
}

loadAll();
</script>
</body>
