<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi MEP — OneOrtho Medical</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F8F7F4;min-height:100vh;color:#1a1a1a}
.layout{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}

/* ── TOPBAR ── */
.topbar{padding:14px 24px;border-bottom:1px solid #E8E5DE;display:flex;align-items:center;justify-content:space-between;background:#fff;gap:12px;flex-wrap:wrap}
.logo{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;color:#004B32;letter-spacing:-.3px}
.logo em{font-style:normal;color:#AAE66E}
.logo-sub{font-size:11px;color:#bbb;margin-top:1px}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ── KPI STRIP ── */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #E8E5DE;background:#fff}
.kpi{padding:14px 20px;border-right:1px solid #E8E5DE}
.kpi:last-child{border-right:none}
.kpi-val{font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#bbb;margin-top:5px}
.kpi-trend{font-size:11px;margin-top:5px;font-weight:500}

/* ── BODY (sidebar + main) ── */
.body{display:grid;grid-template-columns:220px 1fr 260px;min-height:0}

/* ── SIDEBAR ── */
.sidebar{border-right:1px solid #E8E5DE;background:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#ccc;padding:4px 8px;margin-top:12px;margin-bottom:2px}
.sb-section:first-child{margin-top:0}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background .1s;border:1px solid transparent}
.sb-item:hover{background:#F8F7F4}
.sb-item.active{background:#F0F9F5;border-color:#C8E6DA}
.sb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sb-name{font-size:12px;font-weight:500;color:#333;flex:1}
.sb-item.active .sb-name{color:#004B32;font-weight:600}
.sb-count{font-size:10px;color:#ccc;font-weight:600;font-variant-numeric:tabular-nums}
.sb-status{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background .1s}
.sb-status:hover{background:#F8F7F4}
.sb-status.active{background:#F0F9F5}
.sb-status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sb-status-name{font-size:12px;color:#555;flex:1}
.sb-status.active .sb-status-name{color:#004B32;font-weight:500}
.sb-divider{height:1px;background:#E8E5DE;margin:8px 0}
.sb-add-btn{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:#aaa;transition:all .1s;border:1px dashed #E0DDD6;margin-top:4px;justify-content:center}
.sb-add-btn:hover{color:#004B32;border-color:#004B32;background:#F0F9F5}

/* ── MAIN CONTENT ── */
.main{padding:16px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}

/* ── CALENDAR ── */
.cal-wrap{background:#fff;border-radius:12px;border:1px solid #E8E5DE;overflow:hidden}
.cal-nav-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #E8E5DE}
.cal-nav-title{font-family:'Sora',sans-serif;font-weight:600;font-size:14px}
.cal-nav-btns{display:flex;gap:4px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:#F8F7F4;border-bottom:1px solid #E8E5DE}
.cal-day-lbl{text-align:center;padding:8px 4px;font-size:10px;font-weight:600;color:#bbb;text-transform:uppercase;letter-spacing:.6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:82px;border-right:1px solid #F0EDE6;border-bottom:1px solid #F0EDE6;padding:6px 5px;cursor:pointer;transition:background .1s}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:#FAFAF7}
.cal-cell.empty{background:#F8F7F4;cursor:default}
.cal-cell.today-col{background:#F0F9F5}
.day-num{font-size:11px;color:#ccc;margin-bottom:3px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:600}
.day-num.today{background:#004B32;color:#fff}
.ev-pill{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ev-pill:hover{opacity:.75}
.more-link{font-size:9px;color:#ccc;cursor:pointer;margin-top:1px}

/* ── RIGHT PANEL ── */
.right-panel{border-left:1px solid #E8E5DE;background:#fff;padding:16px 14px;overflow-y:auto}
.rp-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#ccc;margin-bottom:10px;margin-top:16px}
.rp-section:first-child{margin-top:0}
.rp-card{padding:10px 12px;border:1px solid #E8E5DE;border-radius:8px;margin-bottom:7px;cursor:pointer;transition:all .1s;border-left-width:3px}
.rp-card:hover{background:#FAFAF7;border-color:#D0CEC8}
.rp-card-name{font-size:12px;font-weight:600;color:#1a1a1a;margin-bottom:4px;line-height:1.3}
.rp-card-meta{font-size:10px;color:#bbb;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rp-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:600}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.month-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:600}
.month-controls{display:flex;gap:8px;align-items:center}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:24px}
.tl-line{position:absolute;left:7px;top:0;bottom:0;width:1px;background:#E8E5DE}
.tl-month-header{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#ccc;margin-bottom:10px;margin-top:20px;display:flex;align-items:center;gap:8px}
.tl-month-header:first-child{margin-top:0}
.tl-month-header::after{content:'';flex:1;height:1px;background:#E8E5DE}
.tl-item{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;position:relative}
.tl-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-left:-24px;margin-top:10px;border:2px solid #fff;box-shadow:0 0 0 1px #E8E5DE;z-index:1;position:relative}
.tl-card{flex:1;border:1px solid #E8E5DE;border-radius:10px;background:#fff;padding:12px 14px;cursor:pointer;transition:all .12s;border-left-width:3px}
.tl-card:hover{border-color:#D0CEC8;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.tl-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.tl-card-name{font-size:13px;font-weight:600;color:#1a1a1a;line-height:1.3}
.tl-card-date{font-size:11px;color:#bbb;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-card-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tl-tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:600}
.tl-note{font-size:11px;color:#aaa;margin-top:7px;padding-top:7px;border-top:1px solid #F5F3EE;line-height:1.5}
.tl-edit-btn{opacity:0;transition:opacity .1s;background:none;border:none;cursor:pointer;color:#aaa;padding:2px 5px;border-radius:5px;font-size:12px}
.tl-card:hover .tl-edit-btn{opacity:1}
.tl-edit-btn:hover{background:#F8F7F4;color:#333}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:4rem 2rem;color:#ccc;font-size:13px;line-height:1.8}
.empty-state i{font-size:36px;display:block;margin-bottom:14px;color:#ddd}
.empty-strong{font-weight:600;color:#888;background:#F0EDE8;padding:1px 7px;border-radius:5px}

/* ── BUTTONS ── */
.btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#333;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s;line-height:1;white-space:nowrap}
.btn:hover{background:#F2EFE8;border-color:#ccc}
.btn-primary{background:#004B32;color:#fff;border-color:#004B32}
.btn-primary:hover{background:#003825}
.btn-ghost{background:transparent;color:#888;border-color:#E0DDD6}
.btn-ghost:hover{background:#F2EFE8;color:#444}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px 9px;min-width:32px;justify-content:center}

/* ── SETTINGS ── */
.settings-wrap{padding:20px 24px}
.settings-panel{background:#fff;border-radius:12px;border:1px solid #E8E5DE;overflow:hidden}
.stabs{display:flex;border-bottom:1px solid #E8E5DE}
.stab{padding:13px 20px;font-size:13px;font-weight:500;cursor:pointer;color:#aaa;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;transition:all .12s;white-space:nowrap}
.stab:hover:not(.active){color:#555}
.stab.active{color:#004B32;border-bottom-color:#004B32;font-weight:600}
.sbody{padding:1.75rem}
.section-title{font-size:11px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.entity-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.entity-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid #EAE7E0;border-radius:9px;background:#fff;transition:all .1s}
.entity-row:hover{border-color:#D0CEC8;background:#FAFAF7}
.e-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.e-name{flex:1;font-size:13px;font-weight:500;color:#1a1a1a}
.e-count{font-size:11px;color:#ccc;font-weight:500}
.e-actions{display:flex;gap:5px;flex-shrink:0}
.act-edit{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;border:1px solid #E0DDD6;background:#fff;cursor:pointer;color:#aaa;font-size:14px;transition:all .12s}
.act-edit:hover{background:#F0FAF5;border-color:#004B32;color:#004B32}
.act-del{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;border:1px solid #F5DADA;background:#FFF8F8;cursor:pointer;color:#E24B4A;font-size:14px;transition:all .12s}
.act-del:hover{background:#E24B4A;border-color:#E24B4A;color:#fff}
.add-zone{background:#FAFAF7;border-radius:9px;padding:14px;border:1px dashed #DDD9D2;margin-top:6px}
.add-zone-label{font-size:10px;font-weight:700;color:#ccc;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
.add-row{display:flex;gap:8px;align-items:center}
.cpick{width:38px;height:36px;border:1px solid #E0DDD6;border-radius:7px;cursor:pointer;padding:3px;background:#fff;flex-shrink:0}
.add-input{flex:1;font-family:'Inter',sans-serif;font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#1a1a1a;transition:border-color .12s}
.add-input:focus{outline:none;border-color:#004B32;box-shadow:0 0 0 3px rgba(0,75,50,0.07)}
.inline-edit-row{display:flex;gap:8px;align-items:center;flex:1}
.inline-edit-input{flex:1;font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #AAE66E;background:#F5FDF0;color:#1a1a1a;outline:none}
.settings-footer{padding:12px 20px;border-top:1px solid #F0EDE6;display:flex;align-items:center;justify-content:space-between;background:#FAFAF7}
.no-entries{font-size:13px;color:#ccc;padding:8px 0;font-style:italic}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;padding:2rem;width:440px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 4px 40px rgba(0,0,0,0.12)}
.modal-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:1.5rem}
.f-label{font-size:11px;color:#aaa;display:block;margin-bottom:5px;margin-top:14px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.f-input{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#1a1a1a;transition:border-color .12s}
.f-input:focus{outline:none;border-color:#004B32;box-shadow:0 0 0 3px rgba(0,75,50,0.07)}
.f-textarea{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;border-radius:8px;border:1px solid #E0DDD6;background:#fff;color:#1a1a1a;resize:vertical;min-height:64px}
.f-textarea:focus{outline:none;border-color:#004B32;box-shadow:0 0 0 3px rgba(0,75,50,0.07)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #F0EDE6}
.detail-row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #F5F3EE;font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#bbb;min-width:90px;font-size:11px;flex-shrink:0;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding-top:2px}
.prod-picker{display:flex;flex-direction:column;gap:2px;padding:6px;background:#fff;border-radius:8px;border:1px solid #E0DDD6;max-height:160px;overflow-y:auto}
.prod-check{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .1s;user-select:none}
.prod-check:hover{background:#F8F7F4}
.prod-check input[type=checkbox]{width:15px;height:15px;accent-color:#004B32;cursor:pointer;flex-shrink:0}
.prod-check-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.prod-check-name{font-size:13px;color:#333}
.prod-tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;flex-shrink:0}

/* ── LOADING ── */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem;color:#ccc;font-size:13px;gap:14px}
.loading-dots{display:flex;gap:6px}
.loading-dot{width:8px;height:8px;border-radius:50%;background:#AAE66E;animation:pulse 1.2s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}
.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  .body{grid-template-columns:220px 1fr}
  .right-panel{display:none}
}
@media(max-width:768px){
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(2){border-right:none}
  .kpi:nth-child(3){border-top:1px solid #E8E5DE}
  .kpi:nth-child(4){border-top:1px solid #E8E5DE;border-right:none}
  .body{grid-template-columns:1fr}
  .sidebar{display:none}
  .right-panel{display:none}
  .main{padding:14px 16px}
  .topbar{padding:12px 16px}
  .kpi{padding:12px 16px}
}
@media(max-width:480px){
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .kpi-val{font-size:20px}
  .modal-overlay{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;width:100%;max-width:100%;padding:1.5rem 1.25rem;max-height:92vh}
}
</style>

<body>
<div class="layout" id="app"></div>
<script>
const SB_URL='https://odsvvwmtlkglpjqeqjjq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kc3Z2d210bGtnbHBqcWVxampxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTc2NjEsImV4cCI6MjA5NDkzMzY2MX0.aA2LxUE9N8ZYF_p4W2SEOyMS-OVIIlGPSRFGXZKKKMU';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};

async function sbGet(t){const r=await fetch(`${SB_URL}/rest/v1/${t}?select=*`,{headers:H});return r.ok?r.json():[]}
async function sbUpsert(t,row){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(row)});return r.ok}
async function sbDelete(t,col,val){const r=await fetch(`${SB_URL}/rest/v1/${t}?${col}=eq.${encodeURIComponent(val)}`,{method:'DELETE',headers:H});return r.ok}
async function sbPatch(t,col,val,data){const r=await fetch(`${SB_URL}/rest/v1/${t}?${col}=eq.${encodeURIComponent(val)}`,{method:'PATCH',headers:H,body:JSON.stringify(data)});return r.ok}

function dbToRelease(r){return{id:r.id,name:r.name,clientId:r.client_id,productIds:r.product_ids||[],date:r.date,env:r.env,status:r.status,note:r.note||''}}
function releaseToDb(r){return{id:r.id,name:r.name,client_id:r.clientId,product_ids:r.productIds||[],date:r.date,env:r.env,status:r.status,note:r.note||''}}

const STATUSES=[
  {key:'planned',label:'Planifiée',color:'#378ADD',bg:'#e6f1fb'},
  {key:'in_progress',label:'En cours',color:'#BA7517',bg:'#faeeda'},
  {key:'done',label:'Déployée',color:'#004B32',bg:'#e1f5ee'},
  {key:'failed',label:'Échouée',color:'#A32D2D',bg:'#fcebeb'},
  {key:'rollback',label:'Rollback',color:'#702D5A',bg:'#f5e8f2'}
];
function stOf(k){return STATUSES.find(s=>s.key===k)||STATUSES[0]}

let products=[],clients=[],releases=[];
function prodById(id){return products.find(p=>p.id===id)}
function clientById(id){return clients.find(c=>c.id===id)}
function clientColor(cid){return(clientById(cid)||{color:'#aaa'}).color}

let S={
  filterClient:'all',filterStatus:'all',
  page:'main',stab:'clients',
  modal:null,editId:null,detailId:null,loading:false,
  form:{name:'',productIds:[],clientId:'',date:'',env:'Production',status:'planned',note:''},
  editingProdId:null,editingProdName:'',editingProdColor:'',
  editingClientId:null,editingClientName:'',editingClientColor:'',
  newProdName:'',newProdColor:'#9F8AEA',
  newClientName:'',newClientColor:'#AAE66E',
};

async function loadAll(){
  S.loading=true;render();
  try{
    const [c,p,r]=await Promise.all([sbGet('clients'),sbGet('products'),sbGet('releases')]);
    clients=c||[];products=p||[];releases=(r||[]).map(dbToRelease);
  }catch(e){console.error(e)}
  S.loading=false;render();
}

function filtered(){
  return releases.filter(r=>{
    if(S.filterClient!=='all'&&r.clientId!==S.filterClient)return false;
    if(S.filterStatus!=='all'&&r.status!==S.filterStatus)return false;
    return true;
  });
}

function toggleProd(pid){
  const ids=S.form.productIds;
  S.form.productIds=ids.includes(pid)?ids.filter(x=>x!==pid):[...ids,pid];
  render();
}

function prodTagsHtml(pids){
  if(!pids||!pids.length)return`<span style="color:#bbb;font-size:12px;font-style:italic">Aucun</span>`;
  return pids.map(pid=>{const p=prodById(pid);return p?`<span class="tag" style="background:#F0EDE8;color:#666">${p.name}</span>`:''}).join('');
}

/* ── KPIs ── */
function renderKpis(){
  const total=releases.length;
  const done=releases.filter(r=>r.status==='done').length;
  const inProgress=releases.filter(r=>r.status==='in_progress').length;
  const failed=releases.filter(r=>r.status==='failed'||r.status==='rollback').length;
  const rate=total?Math.round(done/total*100):0;
  return`<div class="kpi-strip">
    <div class="kpi">
      <div class="kpi-val">${total}</div>
      <div class="kpi-lbl">MEPs totales</div>
      <div class="kpi-trend" style="color:#aaa">${releases.filter(r=>r.status==='planned').length} planifiées</div>
    </div>
    <div class="kpi">
      <div class="kpi-val" style="color:#004B32">${rate}%</div>
      <div class="kpi-lbl">Taux de succès</div>

/* ── STATE calendrier ── */
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();

/* ── CALENDRIER ── */
function renderCalendar(){
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const sd=new Date(calYear,calMonth,1).getDay()||7;
  const today=new Date();
  const filt=filtered();
  const byDay={};
  filt.forEach(r=>{
    const rd=new Date(r.date+'T00:00:00');
    if(rd.getFullYear()===calYear&&rd.getMonth()===calMonth){
      const k=rd.getDate();if(!byDay[k])byDay[k]=[];byDay[k].push(r);
    }
  });
  const labels=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  let cells='';
  for(let i=1;i<sd;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=dim;d++){
    const isT=today.getDate()===d&&today.getMonth()===calMonth&&today.getFullYear()===calYear;
    const dr=byDay[d]||[];const show=dr.slice(0,3);const more=dr.length-3;
    cells+=`<div class="cal-cell${isT?' today-col':''}" onclick="clickDay(${d})">
      <div class="day-num${isT?' today':''}">${d}</div>
      ${show.map(r=>{
        const c=clientColor(r.clientId);
        const pids=r.productIds||[];
        const label=r.name+(pids.length>1?` (${pids.length})`:'');
        return`<div class="ev-pill" style="background:${c}22;color:${c};border:1px solid ${c}55" onclick="event.stopPropagation();openDetail(${r.id})" title="${r.name}">${label}</div>`;
      }).join('')}
      ${more>0?`<div class="more-link">+${more}</div>`:''}
    </div>`;
  }
  return`<div class="cal-wrap">
    <div class="cal-nav-bar">
      <div class="cal-nav-title">${months[calMonth]} ${calYear}</div>
      <div class="cal-nav-btns">
        <button class="btn btn-icon btn-sm" onclick="prevM()"><i class="ti ti-chevron-left"></i></button>
        <button class="btn btn-sm" onclick="goToday()" style="font-size:12px">Aujourd'hui</button>
        <button class="btn btn-icon btn-sm" onclick="nextM()"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
    <div class="cal-head">${labels.map(l=>`<div class="cal-day-lbl">${l}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}

/* ── TIMELINE (vue liste) ── */

  const filt=filtered().sort((a,b)=>a.date.localeCompare(b.date));
  if(!filt.length)return`<div class="empty-state"><i class="ti ti-rocket" aria-hidden="true"></i>${
    releases.length===0
      ?`Commencez par ajouter des clients et produits via <span class="empty-strong">Configurer</span>, puis créez votre première MEP.`
      :`Aucune mise en production pour cette sélection.`
  }</div>`;

  const byMonth={};
  filt.forEach(r=>{
    const d=new Date(r.date+'T00:00:00');
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!byMonth[key])byMonth[key]=[];
    byMonth[key].push(r);
  });

  const monthNames=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  let html=`<div class="timeline"><div class="tl-line"></div>`;
  Object.entries(byMonth).forEach(([key,items])=>{
    const [y,m]=key.split('-');
    html+=`<div class="tl-month-header">${monthNames[+m-1]} ${y}</div>`;
    items.forEach(r=>{
      const st=stOf(r.status);
      const c=clientColor(r.clientId);
      const cli=clientById(r.clientId);
      const pids=r.productIds||[];

        <div class="tl-dot" style="background:${c}"></div>

          <div class="tl-card-top">
            <div class="tl-card-name">${r.name}</div>
            <div style="display:flex;align-items:center;gap:6px">
              <div class="tl-card-date">${dateStr}</div>
              <button class="tl-edit-btn" onclick="event.stopPropagation();openEdit(${r.id})"><i class="ti ti-edit" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="tl-card-meta">
            <span class="tl-tag" style="background:${st.bg};color:${st.color}">${st.label}</span>
            ${cli?`<span class="tl-tag" style="background:${c}18;color:${c}">${cli.name}</span>`:''}
            ${pids.map(pid=>{const p=prodById(pid);return p?`<span class="tl-tag" style="background:#F0EDE8;color:#666">${p.name}</span>`:''}).join('')}

          </div>
          ${r.note?`<div class="tl-note">${r.note}</div>`:''}

function exportCSV(){
  if(!releases.length){alert('Aucune MEP à exporter');return}
  const rows=[['Nom','Client','Produits','Date','Environnement','Statut','Note']];
  [...releases].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    const cli=clientById(r.clientId);const st=stOf(r.status);
    const prods=(r.productIds||[]).map(pid=>{const p=prodById(pid);return p?p.name:''}).filter(Boolean).join(' | ');
    rows.push([r.name,cli?cli.name:'',prods,r.date,r.env,st.label,r.note||'']);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='mep-oneortho.csv';a.click();
  URL.revokeObjectURL(url);
}

function prevM(){if(calMonth===0){calMonth=11;calYear--}else calMonth--;render()}
function nextM(){if(calMonth===11){calMonth=0;calYear++}else calMonth++;render()}
function goToday(){calYear=new Date().getFullYear();calMonth=new Date().getMonth();render()}
function clickDay(d){
  const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  S.form={name:'',productIds:[],clientId:clients[0]?.id||'',date:ds,env:'Production',status:'planned',note:''};
  S.editId=null;S.modal='form';render();
}
function openAdd(){
  const today=new Date().toISOString().slice(0,10);
  S.form={name:'',productIds:[],clientId:clients[0]?.id||'',date:today,env:'Production',status:'planned',note:''};
  S.editId=null;S.modal='form';render();
}
function openEdit(id){const r=releases.find(x=>x.id===id);S.form={...r,productIds:[...(r.productIds||[])]};S.editId=id;S.modal='form';render()}
function openDetail(id){S.detailId=id;S.modal='detail';render()}
function cModal(e){if(e&&e.target!==e.currentTarget)return;S.modal=null;render()}
function sf(k,v){S.form[k]=v}

async function saveRelease(){
  if(!S.form.name||!S.form.date){alert('Nom et date requis');return}
  if(!S.form.clientId&&clients.length)S.form.clientId=clients[0].id;
  const id=S.editId||Date.now();
  const ok=await sbUpsert('releases',releaseToDb({...S.form,id}));
  if(!ok){alert('Erreur lors de la sauvegarde');return}
  if(S.editId){const i=releases.findIndex(x=>x.id===S.editId);releases[i]={...S.form,id:S.editId}}
  else releases.push({...S.form,id});
  S.modal=null;render();
}
async function delRelease(id){
  const ok=await sbDelete('releases','id',id);
  if(!ok){alert('Erreur');return}
  releases=releases.filter(x=>x.id!==id);S.modal=null;render();
}
function startEditProd(id){const p=products.find(x=>x.id===id);S.editingProdId=id;S.editingProdName=p.name;S.editingProdColor=p.color;render()}
async function saveProd(id){
  const name=S.editingProdName.trim();if(!name)return;
  const ok=await sbPatch('products','id',id,{name,color:S.editingProdColor});
  if(!ok){alert('Erreur');return}
  const i=products.findIndex(p=>p.id===id);products[i]={...products[i],name,color:S.editingProdColor};
  S.editingProdId=null;render();
}
async function deleteProd(id){
  const n=releases.filter(r=>(r.productIds||[]).includes(id)).length;
  if(!confirm(n>0?`Ce produit est lié à ${n} MEP(s). Le retirer ?`:'Supprimer ?'))return;
  for(const r of releases.filter(r=>(r.productIds||[]).includes(id))){
    const ids=r.productIds.filter(x=>x!==id);
    await sbPatch('releases','id',r.id,{product_ids:ids});r.productIds=ids;
  }
  const ok=await sbDelete('products','id',id);
  if(!ok){alert('Erreur');return}
  products=products.filter(p=>p.id!==id);render();
}
async function addProd(){
  const name=S.newProdName.trim();if(!name){alert('Saisissez un nom');return}
  const id='p'+Date.now();
  if(!await sbUpsert('products',{id,name,color:S.newProdColor})){alert('Erreur');return}
  products.push({id,name,color:S.newProdColor});S.newProdName='';render();
}
function startEditClient(id){const c=clients.find(x=>x.id===id);S.editingClientId=id;S.editingClientName=c.name;S.editingClientColor=c.color;render()}
async function saveClient(id){
  const name=S.editingClientName.trim();if(!name)return;
  const ok=await sbPatch('clients','id',id,{name,color:S.editingClientColor});
  if(!ok){alert('Erreur');return}
  const i=clients.findIndex(c=>c.id===id);clients[i]={...clients[i],name,color:S.editingClientColor};
  S.editingClientId=null;render();
}
async function deleteClient(id){
  const n=releases.filter(r=>r.clientId===id).length;
  if(!confirm(n>0?`Ce client est lié à ${n} MEP(s). Supprimer quand même ?`:'Supprimer ?'))return;
  for(const r of releases.filter(r=>r.clientId===id))await sbDelete('releases','id',r.id);
  if(!await sbDelete('clients','id',id)){alert('Erreur');return}
  releases=releases.filter(r=>r.clientId!==id);
  if(S.filterClient===id)S.filterClient='all';
  clients=clients.filter(c=>c.id!==id);render();
}
async function addClient(){
  const name=S.newClientName.trim();if(!name){alert('Saisissez un nom');return}
  const id='c'+Date.now();
  if(!await sbUpsert('clients',{id,name,color:S.newClientColor})){alert('Erreur');return}
  clients.push({id,name,color:S.newClientColor});S.newClientName='';render();
}

loadAll();
</script>
